[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/engine",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anyscapelabs/greplog"

[workspace.dependencies]
arrow = "=52.0.0"
arrow-ord = "=52.2.0"
arrow-json = "=52.2.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["json"] }
chrono = "=0.4.34"
clap = { version = "4", features = ["derive"] }
crossbeam = "0.8"
crossterm = "0.28"
datafusion = "=39.0.0"
parquet = "=52.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }