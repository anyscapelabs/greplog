[workspace]
resolver = "2"
members = [
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anyscapelabs/greplog"

[workspace.dependencies]
arrow = "=52.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "=0.4.34"
thiserror = "1"