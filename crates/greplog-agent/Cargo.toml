[package]
name = "greplog-agent"
version = "0.1.0"
edition = "2021"

[features]
default = []
bundled = ["duckdb/bundled"]

[dependencies]
greplog-core = { path = "../greplog-core" }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
prost = "0.13"

duckdb = { version = "1", default-features = false }

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
uuid = { version = "1.23.5", features = ["v4"] }
