name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ github.run_id }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binaries:
    name: Binaries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # macos-13 Intel runners have remained indefinitely queued. macos-14
          # provides an ARM host with Apple clang, which can cross-compile the
          # x86_64 macOS target while using the same available runner pool.
          - { name: macos-x86_64, os: macos-14, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The bundle is baked in at compile time; skip the binary otherwise.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard && npm run build --prefix dashboard
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release -p greplog-cli --target ${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        run: |
          dir="greplog-v${RELEASE_TAG#v}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/greplog" "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          else
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: greplog-${{ matrix.name }}
          path: |
            greplog-*.tar.gz
            greplog-*.tar.gz.sha256

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Greplog ${{ inputs.tag || github.ref_name }}
          files: |
            greplog-*.tar.gz
            greplog-*.tar.gz.sha256
          generate_release_notes: true

  publish-python:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build && python -m build sdk/python
      - name: Check if version already on PyPI
        id: check-pypi
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)".*/\1/p' sdk/python/pyproject.toml | head -1)
          echo "Checking PyPI for greplog-sdk $VERSION"
          if curl -s -f "https://pypi.org/pypi/greplog-sdk/${VERSION}/json" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on PyPI, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check-pypi.outputs.exists == 'false'
        with:
          packages-dir: sdk/python/dist/

  publish-rust:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check if version already on crates.io
        id: check-crates
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -1)
          echo "Checking crates.io for greplog-sdk $VERSION"
          if curl -s -f -H "User-Agent: GreplogCheck/0.1" "https://crates.io/api/v1/crates/greplog-sdk/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on crates.io, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo publish --allow-dirty
        if: steps.check-crates.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-node:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-go:
    if: github.event_name != 'workflow_dispatch'
    # Go has no registry push: consumers fetch the module straight from this
    # repository. A module living in sdk/go/ is versioned by a tag of the form
    # sdk/go/vX.Y.Z, so each release tag gets a companion tag pushed here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push the Go module tag (sdk/go/<release tag>)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/sdk/go/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "tag sdk/go/${GITHUB_REF_NAME} already exists; skipping"
            exit 0
          fi
          git tag "sdk/go/${GITHUB_REF_NAME}"
          git push origin "sdk/go/${GITHUB_REF_NAME}"
