name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-\${{ github.ref }}

jobs:
  binaries:
    name: Binaries (\${{ matrix.name }})
    runs-on: \${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: \${{ matrix.target }}
      # The bundle is baked in at compile time; skip the binary otherwise.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard && npm run build --prefix dashboard
      - uses: Swatinem/rust-cache@v2
        with:
          key: \${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release -p greplog-cli --target \${{ matrix.target }}
      - name: Package and checksum
        shell: bash
        run: |
          dir="greplog-v\${GITHUB_REF_NAME#v}-\${{ matrix.name }}"
          mkdir "\$dir"
          cp "target/\${{ matrix.target }}/release/greplog" "\$dir/"
          tar czf "\$dir.tar.gz" "\$dir"
          sha256sum "\$dir.tar.gz" > "\$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: greplog-\${{ matrix.name }}
          path: |
            greplog-*.tar.gz
            greplog-*.tar.gz.sha256

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            greplog-*.tar.gz
            greplog-*.tar.gz.sha256
          generate_release_notes: true

  publish-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build && python -m build sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  publish-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: \${{ secrets.NPM_TOKEN }}
