name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (build + test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # rust_embed bakes dashboard/dist into the binary at compile time;
      # without this step every artifact ships the "dashboard not built" page.
      - name: Build dashboard bundle
        run: >
          npm ci --prefix dashboard &&
          npm run build --prefix dashboard
      - uses: Swatinem/rust-cache@v2
      - name: SDK versions agree across manifests
        run: bash scripts/check-versions.sh
      - name: Build all targets
        run: cargo build --workspace --all-targets
      - name: Run all tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  benchmark:
    name: Engine benchmark (release throughput sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run throughput ceiling sweep
        run: cargo test --release -p greplog-engine --test throughput_benchmark -- --nocapture

  sdk-rust:
    name: Rust SDK (build + test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - run: cargo build
      - run: cargo test
      - run: cargo clippy --all-targets

  sdk-python:
    name: Python SDK (test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -q

  docs:
    name: Docs (links + rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rustdoc builds without warnings
        run: |
          export RUSTDOCFLAGS="-D warnings"
          cargo doc --no-deps --workspace --quiet
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2
            --exclude 'localhost|127\.0\.0\.1|greplog\.dev'
            README.md CHANGELOG.md SECURITY.md docs crates sdk example dashboard/README.md
          fail: true

  dashboard:
    name: Dashboard (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  sdk-node:
    name: Node SDK (typecheck + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  sdk-go:
    name: Go SDK (build + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...